<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<style>
@import url('fonts-local.css');
:root{
  --bg:#f4f0eb; --purple:#6d28d9; --purple-dark:#4c1d95; --purple-soft:#8b5cf6; --purple-light:#e8e0f4;
  --t1:#1a1428; --t2:#2c2538; --t3:#6b6478; --divider:rgba(26,20,40,.13);
  --f-label:"Syne","Noto Sans SC",sans-serif;
  --f-body:"LXGW WenKai",serif;
}
@page{ size:A4; margin:0; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:210mm; height:297mm; }
.page{ width:210mm; height:297mm; background:var(--bg); position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:38mm 32mm;
  -webkit-font-smoothing:antialiased; }
.grid{ position:absolute; inset:0; opacity:.4; pointer-events:none;
  background-image:linear-gradient(rgba(26,20,40,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(26,20,40,.045) 1px,transparent 1px); background-size:18mm 18mm; }
.page > *{ position:relative; z-index:1; }
.label{ font-family:var(--f-label); font-size:11pt; font-weight:700; letter-spacing:.3em;
  text-transform:uppercase; color:var(--purple); margin-bottom:22pt; }
.glyph{ font-family:"Inter",sans-serif; font-size:96pt; line-height:.4; color:var(--purple-light); margin-bottom:16pt; }
.def{ text-align:center; max-width:146mm; font-family:var(--f-body); }
.def .lead{ font-size:21pt; line-height:1.6; color:var(--t1); font-weight:700; margin-bottom:20pt; }
.def .lead b{ color:var(--purple); }
.def p{ font-size:13.5pt; line-height:1.9; color:var(--t2); margin-bottom:12pt; }
.def .vow{ font-size:14pt; line-height:1.85; color:var(--purple-dark); font-weight:700;
  margin:16pt 0 12pt; padding:11pt 0; border-top:1px solid var(--divider); border-bottom:1px solid var(--divider); }
.def .last{ color:var(--t1); font-weight:700; font-size:15pt; margin-top:4pt; }
.def .tail{ font-size:12.5pt; color:var(--t3); margin-top:14pt; margin-bottom:0; }
.rule{ width:54px; height:3px; background:linear-gradient(90deg,var(--purple),var(--purple-soft)); margin-top:26pt; }
</style></head>
<body><div class="page"><div class="grid"></div>
  <div class="label">卷首 · 题词</div>
  <div class="glyph">&ldquo;</div>
  <div class="def">
    <div class="lead">当智能触手可及时，<br>企业追问的是：<b>可不可托付</b>。</div>
    <p>模型能说会道，落不到实处就换不来信任。用足够好的工程技术把服务做到位，再用服务沉淀出信任——在任何情况下都提供稳定可靠的服务，是智能体被委以重任的基础。</p>
    <p class="vow">目标不偏移、动作不落空、任务不中断、<br>执行不越界、交互不失联、轨迹不丢失。</p>
    <p>这是 Harness 工程可信赖的服务承诺。</p>
    <p class="last">翻译成最朴素的话：<br>事事有回应，件件有着落。</p>
    <p class="tail">本卷要交付的，正是让这句话从口号变成代码的全部工程方法。</p>
  </div>
  <div class="rule"></div>
</div></body></html>
