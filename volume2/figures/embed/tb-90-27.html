<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:23px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:9px 11px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left">层</th><th style="text-align:left;white-space:nowrap">强制点</th><th style="text-align:left">失效模式</th><th style="text-align:left">共享依赖</th><th style="text-align:left">fail-open / closed</th><th style="text-align:left;white-space:nowrap">兜底</th><th style="text-align:left">证据</th></tr></thead><tbody><tr><td style="text-align:left">permission deny</td><td style="text-align:left;white-space:nowrap">求值序最先</td><td style="text-align:left">规则未覆盖</td><td style="text-align:left">规则库</td><td style="text-align:left">fail-closed</td><td style="text-align:left;white-space:nowrap">—</td><td style="text-align:left">policy.decided</td></tr><tr><td style="text-align:left">sandbox</td><td style="text-align:left;white-space:nowrap">系统调用层</td><td style="text-align:left">路径规则过宽</td><td style="text-align:left">无（内核强制）</td><td style="text-align:left">fail-closed</td><td style="text-align:left;white-space:nowrap">—</td><td style="text-align:left">沙箱拒绝事件</td></tr><tr><td style="text-align:left">hook（软）</td><td style="text-align:left;white-space:nowrap">工具执行前</td><td style="text-align:left">解析失败即放行</td><td style="text-align:left">shell/解析器</td><td style="text-align:left"><b>fail-open（危险）</b></td><td style="text-align:left;white-space:nowrap">无</td><td style="text-align:left">常缺（反例，11.2 节）</td></tr><tr><td style="text-align:left">classifier（软）</td><td style="text-align:left;white-space:nowrap">内容检查</td><td style="text-align:left">误判/被绕</td><td style="text-align:left">模型/规则</td><td style="text-align:left">视配置</td><td style="text-align:left;white-space:nowrap">permission</td><td style="text-align:left">判定事件</td></tr></tbody></table></div></body></html>
