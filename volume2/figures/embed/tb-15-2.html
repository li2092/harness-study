<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:26px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:12px 14px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left">残余风险</th><th style="text-align:left;white-space:nowrap">契约</th><th style="text-align:left">触发场景</th><th style="text-align:left">owner</th><th style="text-align:left;white-space:nowrap">期限</th></tr></thead><tbody><tr><td style="text-align:left">工具超时后重试，远端已成功</td><td style="text-align:left;white-space:nowrap">副作用</td><td style="text-align:left">reconciliation fixture</td><td style="text-align:left">（第三卷 owner）</td><td style="text-align:left;white-space:nowrap">—</td></tr><tr><td style="text-align:left">subagent 继承父的全放行</td><td style="text-align:left;white-space:nowrap">权限</td><td style="text-align:left">permission fixture</td><td style="text-align:left">（第三卷 owner）</td><td style="text-align:left;white-space:nowrap">—</td></tr><tr><td style="text-align:left">某检测器从未验证过会触发</td><td style="text-align:left;white-space:nowrap">证据</td><td style="text-align:left">detector/certificate fixture</td><td style="text-align:left">（第三卷 owner）</td><td style="text-align:left;white-space:nowrap">—</td></tr></tbody></table></div></body></html>
