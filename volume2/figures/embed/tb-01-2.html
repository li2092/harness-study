<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:28px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:13px 17px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left;white-space:nowrap">级</th><th style="text-align:left;white-space:nowrap">含义</th><th style="text-align:left">判断</th></tr></thead><tbody><tr><td style="text-align:left;white-space:nowrap">L0</td><td style="text-align:left;white-space:nowrap">没机制</td><td style="text-align:left">—</td></tr><tr><td style="text-align:left;white-space:nowrap">L1</td><td style="text-align:left;white-space:nowrap">能跑</td><td style="text-align:left">代码合并、单测通过</td></tr><tr><td style="text-align:left;white-space:nowrap">L2</td><td style="text-align:left;white-space:nowrap">能看</td><td style="text-align:left">生产路径埋了事件，trace 里查得到</td></tr><tr><td style="text-align:left;white-space:nowrap">L3</td><td style="text-align:left;white-space:nowrap">能评</td><td style="text-align:left">有 reward 信号或 verifier 判定</td></tr><tr><td style="text-align:left;white-space:nowrap">L4</td><td style="text-align:left;white-space:nowrap">能比</td><td style="text-align:left">有 on/off 消融，单跑能看出贡献</td></tr><tr><td style="text-align:left;white-space:nowrap">L5</td><td style="text-align:left;white-space:nowrap">能优</td><td style="text-align:left">参数可自动搜索</td></tr></tbody></table></div></body></html>
