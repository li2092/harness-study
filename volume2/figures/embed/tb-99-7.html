<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:28px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:13px 17px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left">术语</th><th style="text-align:left">一句定义</th><th style="text-align:left;white-space:nowrap">立于</th><th style="text-align:left">关联</th></tr></thead><tbody><tr><td style="text-align:left">六契约</td><td style="text-align:left">真相/转移/副作用/交互/权限/证据——运行时正确性拆成的六份可检验承诺</td><td style="text-align:left;white-space:nowrap">1.2</td><td style="text-align:left">四问·工作制品全部</td></tr><tr><td style="text-align:left">四问（检验坐标系）</td><td style="text-align:left">可观测/可控/稳定/闭环——控制论四原则的操作面，检验每份契约是否被守住</td><td style="text-align:left;white-space:nowrap">1.3</td><td style="text-align:left">六契约</td></tr><tr><td style="text-align:left">L0-L5 成熟度尺</td><td style="text-align:left">机制成熟度分级（本书系分级，非业界通则）：L1 能跑、L2 能看、L3 能评…</td><td style="text-align:left;white-space:nowrap">1.3</td><td style="text-align:left">假落地公式</td></tr><tr><td style="text-align:left">假落地诊断公式</td><td style="text-align:left">有名字（L1 在）＋无事件（L2 缺）＝假落地嫌疑高</td><td style="text-align:left;white-space:nowrap">1.3</td><td style="text-align:left">主线一</td></tr><tr><td style="text-align:left">半途设计</td><td style="text-align:left">机制只接一半的线（写了没接通、接通没生效），比没有机制更危险</td><td style="text-align:left;white-space:nowrap">3.1</td><td style="text-align:left">假落地公式</td></tr></tbody></table></div></body></html>
