<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:28px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:13px 17px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left;white-space:nowrap">契约</th><th style="text-align:left">核心问题</th><th style="text-align:left">主场</th><th style="text-align:left">四原则重点格</th></tr></thead><tbody><tr><td style="text-align:left;white-space:nowrap">真相契约</td><td style="text-align:left">哪份状态算数，谁拥有它？</td><td style="text-align:left">第六章、第十章</td><td style="text-align:left">可观测（状态可归属才可观测）</td></tr><tr><td style="text-align:left;white-space:nowrap">转移契约</td><td style="text-align:left">什么事件能让状态从 A 变成 B？</td><td style="text-align:left">第五章、第七章</td><td style="text-align:left">可观测＋稳定（恢复即重放转移）</td></tr><tr><td style="text-align:left;white-space:nowrap">副作用契约</td><td style="text-align:left">声称做了什么，外部世界实际发生了什么？</td><td style="text-align:left">第八章</td><td style="text-align:left">可控（对账硬门）＋闭环</td></tr><tr><td style="text-align:left;white-space:nowrap">交互契约</td><td style="text-align:left">用户、连接与后台 run 如何保持一致？</td><td style="text-align:left">第九章（与第五章分头兑现）</td><td style="text-align:left">稳定（断流不等于断 run）</td></tr><tr><td style="text-align:left;white-space:nowrap">权限契约</td><td style="text-align:left">谁以谁的身份、在什么边界内行动？</td><td style="text-align:left">第十一章、第十二章</td><td style="text-align:left">可控（边界与期限）</td></tr><tr><td style="text-align:left;white-space:nowrap">证据契约</td><td style="text-align:left">凭什么相信状态、动作和完成声明？</td><td style="text-align:left">第十三章</td><td style="text-align:left">全部四格的地基</td></tr></tbody></table></div></body></html>
