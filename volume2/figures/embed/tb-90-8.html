<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:26px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:12px 14px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left;white-space:nowrap">干预点</th><th style="text-align:left">平面边界</th><th style="text-align:left">回答的问题</th><th style="text-align:left">挂载机制</th><th style="text-align:left">证据</th></tr></thead><tbody><tr><td style="text-align:left;white-space:nowrap">assemble</td><td style="text-align:left">State→Execution（投影）</td><td style="text-align:left">模型这次看见什么</td><td style="text-align:left">context assembly（工作制品 Q，10.1 节）</td><td style="text-align:left">组装决策落 policy.decided</td></tr><tr><td style="text-align:left;white-space:nowrap">model</td><td style="text-align:left">Control→Execution</td><td style="text-align:left">这次可选哪些工具/动作</td><td style="text-align:left">tool 暴露与 policy（11.3 节）</td><td style="text-align:left">暴露决策落 policy.decided</td></tr><tr><td style="text-align:left;white-space:nowrap">execute</td><td style="text-align:left">Control→Execution/外部世界</td><td style="text-align:left">是否授权并真正执行</td><td style="text-align:left">approval/sandbox/effect intent（8.3 节）</td><td style="text-align:left">effect intent＋policy.decided</td></tr></tbody></table></div></body></html>
