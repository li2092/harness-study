<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:23px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:9px 11px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left">假设原文</th><th style="text-align:left;white-space:nowrap">所属契约</th><th style="text-align:left">当前形态（注释/口头/分支缺失）</th><th style="text-align:left">确定性档位</th><th style="text-align:left">六要素缺哪几格</th><th style="text-align:left;white-space:nowrap">owner</th></tr></thead><tbody><tr><td style="text-align:left">“SSE 断开 run 继续跑”</td><td style="text-align:left;white-space:nowrap">交互</td><td style="text-align:left">代码注释</td><td style="text-align:left">声称保证，实为 best effort</td><td style="text-align:left">outcome、evidence</td><td style="text-align:left;white-space:nowrap">无</td></tr><tr><td style="text-align:left">…</td><td style="text-align:left;white-space:nowrap"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left;white-space:nowrap"></td></tr></tbody></table></div></body></html>
