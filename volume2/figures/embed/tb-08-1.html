<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:28px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:13px 17px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left;white-space:nowrap">处置</th><th style="text-align:left">适用条件</th><th style="text-align:left">动作</th><th style="text-align:left">账的终局</th></tr></thead><tbody><tr><td style="text-align:left;white-space:nowrap">重试</td><td style="text-align:left">action class 为 idempotent，key 在保留期内</td><td style="text-align:left">同 key 重发，记新 attempt_no</td><td style="text-align:left">retried——result 补齐，最坏也只是“再确认一次”</td></tr><tr><td style="text-align:left;white-space:nowrap">查询</td><td style="text-align:left">目标系统提供读接口</td><td style="text-align:left">查远端实况，回填 outcome</td><td style="text-align:left">queried——账收平，动作一次没多做</td></tr><tr><td style="text-align:left;white-space:nowrap">补偿</td><td style="text-align:left">action class 为 compensatable</td><td style="text-align:left">执行逆操作，记一笔新 effect</td><td style="text-align:left">compensated——补偿也是副作用，也走四段账</td></tr><tr><td style="text-align:left;white-space:nowrap">未知</td><td style="text-align:left">以上都不可用</td><td style="text-align:left">标 unknown，呈现给人</td><td style="text-align:left">manual——诚实交给人裁决</td></tr></tbody></table></div></body></html>
