<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../_base.css">
<style>
  .canvas{width:1320px;padding:24px 26px;background:var(--bg)}
  .cont{font-family:var(--f-label);font-size:19px;font-weight:700;color:var(--t3);
    letter-spacing:.08em;margin:0 0 12px 2px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    font-family:var(--f-body);font-size:26px;line-height:1.6;color:var(--t2)}
  th,td{border:1px solid var(--divider);padding:12px 14px;vertical-align:top;overflow-wrap:break-word}
  th{font-family:var(--f-head);font-weight:700;color:var(--purple-dark);
    background:rgba(109,40,217,.08);border-bottom:2.5px solid var(--purple)}
  tr:nth-child(even) td{background:rgba(26,20,40,.022)}
  td b{color:var(--t1);font-weight:700}
  td em{color:var(--purple-dark);font-style:normal;font-weight:600}
  th code,td code{font-family:"JetBrains Mono","LXGW WenKai",monospace;font-size:.9em;
    background:#efeae2;padding:1px 6px;border-radius:4px;color:var(--purple-dark)}
</style></head>
<body><div class="canvas"><table><thead><tr><th style="text-align:left;white-space:nowrap">契约</th><th style="text-align:left">触发场景</th><th style="text-align:left">残余风险</th><th style="text-align:left">owner（角色）</th><th style="text-align:left">期限</th></tr></thead><tbody><tr><td style="text-align:left;white-space:nowrap">真相契约</td><td style="text-align:left">运行中会话被读取</td><td style="text-align:left">只能读到 run 开始前的旧状态，用户误判“丢了”后重问</td><td style="text-align:left">存储侧负责人</td><td style="text-align:left">增量持久化上线前</td></tr><tr><td style="text-align:left;white-space:nowrap">转移契约</td><td style="text-align:left">用户重问触发抢占</td><td style="text-align:left">抢占决策无事件，旧 run 半轮无声丢失</td><td style="text-align:left">内核负责人</td><td style="text-align:left">转移表与随行事件就位前</td></tr><tr><td style="text-align:left;white-space:nowrap">交互契约</td><td style="text-align:left">点击回答里的外链</td><td style="text-align:left">整窗被带走，前端状态全部丢失</td><td style="text-align:left">前端负责人</td><td style="text-align:left">opener 白名单上线前</td></tr><tr><td style="text-align:left;white-space:nowrap">证据契约</td><td style="text-align:left">任何一次故障复盘</td><td style="text-align:left">关键动作零运行时记录，复盘只能读代码重构</td><td style="text-align:left">平台负责人</td><td style="text-align:left">事件表 L1→L2 五条工单完成前</td></tr></tbody></table></div></body></html>
