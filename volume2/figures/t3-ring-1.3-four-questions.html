<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="_base.css">
<style>
  .stage{margin-top:24px}
  svg{display:block;width:100%;height:auto}
  .mode{fill:#fff;stroke-width:2;rx:10}
  .mode-a{stroke:var(--divider)} .mode-b{stroke:var(--purple);stroke-width:2.4}
  .mt{font-family:var(--f-head);font-size:16.5px;font-weight:800;fill:var(--t2)}
  .mt-b{fill:var(--purple-dark)}
  .card{fill:var(--card);stroke:var(--divider);stroke-width:1.5;rx:12}
  .qt{font-family:var(--f-head);font-size:16.2px;font-weight:800;fill:var(--red)}
  .pr{fill:var(--purple-muted);stroke:var(--purple-light);stroke-width:1.5;rx:15}
  .prt{font-family:var(--f-head);font-size:14.8px;font-weight:700;fill:var(--purple-dark)}
  .qq{font-family:var(--f-head);font-size:18.5px;font-weight:800;fill:var(--t1)}
  .bd{font-family:var(--f-body);font-size:14.4px;fill:var(--t3)}
  .cir{fill:var(--purple-light);stroke:var(--purple-dark);stroke-width:2.4}
  .ct{font-family:var(--f-head);font-size:17px;font-weight:800;fill:var(--purple-dark)}
  .cs{font-family:var(--f-label);font-size:12.2px;font-weight:700;fill:var(--purple)}
  .loop{stroke:var(--purple);stroke-width:2.6;fill:none;marker-end:url(#lp)}
  .comp{font-family:var(--f-body);font-size:15.2px;fill:var(--t2)}
  .band{fill:var(--purple-light);stroke:var(--purple-dark);stroke-width:2.2;rx:10}
  .bt{font-family:var(--f-head);font-size:15.5px;font-weight:800;fill:var(--purple-dark)}
  .bb{font-family:var(--f-body);font-size:14.2px;fill:var(--t2)}
  .arr{stroke:var(--purple);stroke-width:2.4;fill:none;marker-end:url(#lp)}
</style></head>
<body><div class="canvas"><div class="grid-bg"></div><div class="inner">
  <span class="label-type">Harness Study · 第二卷 1.3</span>
  <h1>四问的来历：<span class="em">入门卷四原则，换一个方向用</span></h1>
  <div class="sub">谱系入门卷第九章已经讲透（Wiener 1948 → 钱学森 1954），这里只锚定完备性：一个反馈闭环只有四处会失守，四处失守对上四条原则，四条原则换向成四个检验问句。</div>
  <hr class="rule">

  <div class="stage">
  <svg viewBox="0 0 1188 668" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="lp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    </defs>

    <!-- 换向：设计问 -> 检验问 -->
    <rect class="mode mode-a" x="14" y="8" width="548" height="44"/>
    <text class="mt" x="34" y="36">入门卷第九章 · 设计问：这些部件对上原则了吗</text>
    <path class="arr" d="M570,30 L648,30"/>
    <rect class="mode mode-b" x="656" y="8" width="518" height="44"/>
    <text class="mt mt-b" x="676" y="36">本卷 · 检验问：怎么证明系统没有骗我</text>

    <!-- 四象限 -->
    <g><rect class="card" x="14" y="78" width="514" height="172"/>
      <text class="qt" x="34" y="112">① 感知端失守 —— 看不见，无从反馈</text>
      <rect class="pr" x="34" y="130" width="104" height="30"/><text class="prt" x="50" y="151">可观测性</text>
      <text class="qq" x="156" y="152">→ 看得见吗？</text>
      <text class="bd" x="34" y="192">履行与违约，运行时有没有对应的事件或 trace？</text>
      <text class="bd" x="34" y="218">没有事件，违约就无声。</text></g>

    <g><rect class="card" x="660" y="78" width="514" height="172"/>
      <text class="qt" x="680" y="112">② 决策端失守 —— 看得见，干预不了</text>
      <rect class="pr" x="680" y="130" width="90" height="30"/><text class="prt" x="696" y="151">可控性</text>
      <text class="qq" x="788" y="152">→ 管得住吗？</text>
      <text class="bd" x="680" y="192">真发现了违约，有没有独立于模型自觉的干预手段？</text>
      <text class="bd" x="680" y="218">干预点被绕过，等于没有。</text></g>

    <g><rect class="card" x="660" y="318" width="514" height="172"/>
      <text class="qt" x="680" y="352">③ 扰动下失守 —— 单次成立，换条件发散</text>
      <rect class="pr" x="680" y="370" width="90" height="30"/><text class="prt" x="696" y="391">稳定性</text>
      <text class="qq" x="788" y="392">→ 扰动下稳吗？</text>
      <text class="bd" x="680" y="432">换个输入、重跑一次、并发一下，履行还成立吗？</text>
      <text class="bd" x="680" y="458">只在演示路径上成立的契约不算数。</text></g>

    <g><rect class="card" x="14" y="318" width="514" height="172"/>
      <text class="qt" x="34" y="352">④ 演化端失守 —— 改了，不知道改没改好</text>
      <rect class="pr" x="34" y="370" width="104" height="30"/><text class="prt" x="50" y="391">闭环反馈</text>
      <text class="qq" x="156" y="392">→ 改进有数据吗？</text>
      <text class="bd" x="34" y="432">机制调过之后，有没有对照数据撑着？</text>
      <text class="bd" x="34" y="458">没有数据的"改好了"，是下一轮自欺。</text></g>

    <!-- 中心环 + 流转 -->
    <circle class="cir" cx="594" cy="284" r="62"/>
    <text class="ct" x="594" y="280" text-anchor="middle">反馈闭环</text>
    <text class="cs" x="594" y="304" text-anchor="middle">四处失守 · 四问封口</text>
    <path class="loop" d="M534,140 L652,140"/>
    <path class="loop" d="M917,256 L917,312"/>
    <path class="loop" d="M654,404 L536,404"/>
    <path class="loop" d="M271,312 L271,256"/>

    <text class="comp" x="594" y="536" text-anchor="middle">少一问，漏掉一处失守；多一问，只是前四问的细分——看得见、管得住、稳得住、比得出，是反馈环的最小完备分解。</text>

    <!-- 前哨仪表 -->
    <g><rect class="band" x="14" y="560" width="1160" height="84"/>
      <text class="bt" x="36" y="590">前哨仪表 · declared_vs_executed gap：声称做了 − 有证据做了，差额占比持续 ≥10% 报警——矩阵"看得见吗"一列最先亮的红灯</text>
      <text class="bb" x="36" y="620">同一个指标两头照：工程师的自欺（声称机制上线，trajectory 里事件为零）与模型的自欺（声称改了文件，git diff 里没有）。</text></g>
  </svg>
  </div>

  <div class="foot">
    <div><span class="dot"></span>《Harness Study · 架构与工程卷》1.3 四问来历 · 谱系：入门卷第九章控制论四原则 · 案例已脱敏</div>
  </div>
</div></div></body></html>
